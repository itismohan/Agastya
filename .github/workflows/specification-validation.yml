name: Specification Validation

on:
  push:

permissions:
  contents: read

concurrency:
  group: specification-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-specifications:
    name: Validate specifications and cross-references
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema>=4.20,<5"

      - name: Validate canonical schema and specification instances
        run: python specifications/validate_examples.py

      - name: Validate completeness and cross-references
        run: python specifications/validate_examples.py --cross-references
